name: Segnalazione di un problema
description: Segnala un problema riproducibile di gioco, comandi o configurazione.
title: "[Problema]: "
body:
  - type: markdown
    attributes:
      value: "Scrivi in italiano. Non inserire nomi di bambini, salvataggi reali o informazioni personali nelle segnalazioni pubbliche."
  - type: input
    id: environment
    attributes:
      label: Versione e ambiente
      description: Versione del gioco o dei sorgenti, versione Unity, dispositivo, sistema operativo e risoluzione.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Passi per riprodurre il problema
      description: Indica il luogo di partenza e le azioni che causano il problema.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Comportamento atteso ed effettivo
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Schermate ed errori pertinenti
      description: Includi solo le informazioni necessarie a spiegare il problema.
