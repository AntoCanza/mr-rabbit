name: Proposta di una funzionalità
description: Proponi un miglioramento mirato per apprendimento, gioco o sviluppo.
title: "[Proposta]: "
body:
  - type: textarea
    id: need
    attributes:
      label: Quale attività del bambino o di chi contribuisce migliorerebbe?
      description: Scrivi la proposta in italiano.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Comportamento proposto
      description: Spiega l'interazione e come sostiene il percorso della prima elementare e la centralità della scuola.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Progressi esistenti e alternative
      description: Se pertinenti, indica compatibilità dei salvataggi, accessibilità, ricompense disponibili e alternative.
