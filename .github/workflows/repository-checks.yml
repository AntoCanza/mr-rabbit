name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unity-project-integrity:
    name: Unity project integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate repository
        run: python tools/check_repository.py
      - name: Verifica sito pubblico e indicizzazione
        run: python tools/check_site.py
